<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPROP — Investor Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#f7f5f0;--muted:rgba(247,245,240,0.5);--line:rgba(247,245,240,0.1);--gold:#b08d3e;--green:#4caf82;--red:#e05555;--yellow:#e0b755;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{width:100%;max-width:380px;text-align:center;}
.brand{font-family:'Newsreader',serif;font-size:36px;font-weight:300;margin-bottom:6px;}
.brand-sub{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:48px;}
input{width:100%;background:rgba(247,245,240,0.06);border:1px solid var(--line);color:var(--paper);padding:14px 16px;font-size:14px;font-family:'Inter',sans-serif;font-weight:300;border-radius:4px;margin-bottom:12px;outline:none;transition:border 0.2s;}
input:focus{border-color:var(--gold);}
.btn-primary{width:100%;background:var(--gold);color:var(--ink);border:none;padding:14px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:opacity 0.2s;margin-top:4px;}
.btn-primary:hover{opacity:0.85;}
.err{color:var(--red);font-size:13px;margin-top:10px;}
#app{display:none;min-height:100vh;}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;border-bottom:1px solid var(--line);}
.logo{font-size:14px;letter-spacing:0.12em;font-weight:400;}
.logo-accent{color:var(--gold);}
.user-info{display:flex;align-items:center;gap:20px;}
.welcome{font-size:13px;color:var(--muted);}
.btn-out{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 20px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border-radius:4px;width:auto;transition:border 0.2s;}
.btn-out:hover{border-color:var(--muted);}
.controls{padding:28px 48px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.preset-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;font-size:12px;letter-spacing:0.06em;width:auto;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.preset-btn.active{border-color:var(--gold);color:var(--gold);}
.refresh-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;font-size:12px;width:auto;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;margin-left:auto;}
.refresh-btn:hover{border-color:var(--paper);color:var(--paper);}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:28px 48px;}
.stat-card{background:rgba(247,245,240,0.04);border:1px solid var(--line);border-radius:6px;padding:22px 24px;}
.stat-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.stat-value{font-family:'Newsreader',serif;font-size:32px;font-weight:300;line-height:1;}
.stat-value.gold{color:var(--gold);}
.stat-value.green{color:var(--green);}
.table-wrap{padding:0 48px 48px;overflow-x:auto;}
.table-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.table-title{font-family:'Newsreader',serif;font-size:20px;font-weight:300;font-style:italic;}
.table-meta{font-size:12px;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:800px;}
th{text-align:left;padding:10px 16px;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid var(--line);}
th.right{text-align:right;}
td{padding:14px 16px;border-bottom:1px solid rgba(247,245,240,0.05);vertical-align:middle;}
td.right{text-align:right;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(247,245,240,0.025);}
.camp-name{font-size:13px;line-height:1.4;}
.camp-acc{font-size:11px;color:var(--muted);margin-top:2px;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;}
.pill-green{background:rgba(76,175,130,0.15);color:var(--green);}
.pill-yellow{background:rgba(224,183,85,0.15);color:var(--yellow);}
.pill-red{background:rgba(224,85,85,0.15);color:var(--red);}
.divider-row td{background:rgba(176,141,62,0.06);border-top:1px solid var(--line);font-weight:500;color:var(--gold);}
.profit-col{color:var(--green);}
.revenue-col{color:var(--gold);}
.empty{text-align:center;padding:60px;color:var(--muted);}
.loading{text-align:center;padding:60px;color:var(--muted);font-style:italic;}
.notes-text{font-size:11px;color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:768px){header,.controls,.summary,.table-wrap{padding-left:20px;padding-right:20px;}.stat-value{font-size:26px;}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="brand">JPROP</div>
    <div class="brand-sub">Investor Portal</div>
    <input id="l-email" type="email" placeholder="Email address" />
    <input id="l-pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-primary" onclick="doLogin()">Sign In</button>
    <div id="l-err" class="err"></div>
  </div>
</div>
<div id="app">
  <header>
    <div class="logo">JP<span class="logo-accent">R</span>OP</div>
    <div class="user-info">
      <span class="welcome" id="welcome-name"></span>
      <button class="btn-out" onclick="logout()">Sign Out</button>
    </div>
  </header>
  <div class="controls">
    <button class="preset-btn active" onclick="setPreset('last_week_sun_sat',this)">Last Week</button>
    <button class="preset-btn" onclick="setPreset('this_week_sun_today',this)">This Week</button>
    <button class="preset-btn" onclick="setPreset('this_month',this)">This Month</button>
    <button class="preset-btn" onclick="setPreset('last_month',this)">Last Month</button>
    <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
  </div>
  <div class="summary">
    <div class="stat-card"><div class="stat-label">Total Spend</div><div class="stat-value gold" id="s-spend">—</div></div>
    <div class="stat-card"><div class="stat-label">Leads Generated</div><div class="stat-value" id="s-leads">—</div></div>
    <div class="stat-card"><div class="stat-label">Avg Cost / Lead</div><div class="stat-value" id="s-cpl">—</div></div>
    <div class="stat-card"><div class="stat-label">Closing Sales</div><div class="stat-value gold" id="s-closing">—</div></div>
    <div class="stat-card"><div class="stat-label">Commission (RM)</div><div class="stat-value green" id="s-commission">—</div></div>
    <div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value green" id="s-roi">—</div></div>
  </div>
  <div class="table-wrap">
    <div class="table-header">
      <div class="table-title">Campaign Breakdown</div>
      <div class="table-meta" id="table-meta"></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Campaign</th>
          <th class="right">Spend</th>
          <th class="right">Leads</th>
          <th class="right">CPL</th>
          <th class="right">CPM</th>
          <th class="right">CTR</th>
          <th class="right">Closing Sales</th>
          <th class="right">Nett Sales</th>
          <th class="right">Commission</th>
          <th class="right">ROI</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="camp-tbody">
        <tr><td colspan="11" class="loading">Loading your campaigns…</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
const API = '';
let TOKEN = localStorage.getItem('jprop_token') || '';
let currentPreset = 'last_week_sun_sat';
function rm(v){return 'RM '+Number(v).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:0});}
function cplPill(v){if(!v)return '<span style="color:var(--muted)">—</span>';const cls=v<=50?'pill-green':v<=100?'pill-yellow':'pill-red';return '<span class="pill '+cls+'">RM '+v+'</span>';}
async function apiFetch(path){const r=await fetch(API+path,{headers:{'Authorization':'Bearer '+TOKEN}});if(r.status===401){logout();throw new Error('Auth');}return r.json();}
async function doLogin(){
  const email=document.getElementById('l-email').value;
  const pw=document.getElementById('l-pw').value;
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const d=await r.json();
  if(!r.ok){document.getElementById('l-err').textContent=d.detail||'Login failed';return;}
  TOKEN=d.token;
  localStorage.setItem('jprop_token',TOKEN);
  document.getElementById('welcome-name').textContent='Welcome, '+d.name;
  showApp();
}
function logout(){localStorage.removeItem('jprop_token');TOKEN='';document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';}
function showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';loadDashboard();}
if(TOKEN){document.getElementById('welcome-name').textContent='Welcome';showApp();}
function setPreset(preset,btn){currentPreset=preset;document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadDashboard();}
async function loadDashboard(){
  document.getElementById('camp-tbody').innerHTML='<tr><td colspan="11" class="loading">Fetching live data…</td></tr>';
  ['s-spend','s-leads','s-cpl','s-closing','s-commission','s-roi'].forEach(id=>document.getElementById(id).textContent='…');
  let data;
  try{data=await apiFetch('/api/dashboard?preset='+currentPreset);}catch(e){document.getElementById('camp-tbody').innerHTML='<tr><td colspan="11" class="empty">Failed to load — please refresh</td></tr>';return;}
  const{campaigns,totals}=data;
  document.getElementById('s-spend').textContent=rm(totals.spend);
  document.getElementById('s-leads').textContent=totals.leads||'0';
  document.getElementById('s-cpl').textContent=totals.cpl?'RM '+totals.cpl:'—';
  document.getElementById('s-closing').textContent=totals.closing_sales?totals.closing_sales+' units':'—';
  document.getElementById('s-commission').textContent=totals.commission?rm(totals.commission):'—';
  document.getElementById('s-roi').textContent=totals.roi?totals.roi+'x':'—';
  document.getElementById('table-meta').textContent=campaigns.length+' campaign'+(campaigns.length!==1?'s':'')+' assigned';
  if(!campaigns.length){document.getElementById('camp-tbody').innerHTML='<tr><td colspan="11" class="empty">No campaigns assigned yet. Contact WJ to get access.</td></tr>';return;}
  const rows=campaigns.map(c=>'<tr><td><div class="camp-name">'+c.campaign_name+'</div><div class="camp-acc">'+c.account+'</div></td><td class="right">'+rm(c.spend)+'</td><td class="right">'+(c.leads||'—')+'</td><td class="right">'+cplPill(c.cpl)+'</td><td class="right" style="color:var(--muted)">'+(c.cpm?'RM '+c.cpm:'—')+'</td><td class="right" style="color:var(--muted)">'+(c.ctr?c.ctr+'%':'—')+'</td><td class="right">'+(c.closing_sales?'<b>'+c.closing_sales+' units</b>':'—')+'</td><td class="right" style="color:var(--muted)">'+(c.nett_sales?rm(c.nett_sales):'—')+'</td><td class="right revenue-col">'+(c.commission?rm(c.commission):'—')+'</td><td class="right profit-col"><b>'+(c.roi?c.roi+'x':'—')+'</b></td><td><div class="notes-text" title="'+(c.notes||'')+'">'+(c.notes||'—')+'</div></td></tr>').join('');
  const totalsRow='<tr class="divider-row"><td><b>TOTAL</b></td><td class="right"><b>'+rm(totals.spend)+'</b></td><td class="right"><b>'+totals.leads+'</b></td><td class="right">'+( totals.cpl?'RM '+totals.cpl:'—')+'</td><td class="right">—</td><td class="right">—</td><td class="right"><b>'+(totals.closing_sales?totals.closing_sales+' units':'—')+'</b></td><td class="right"><b>'+(totals.nett_sales?rm(totals.nett_sales):'—')+'</b></td><td class="right"><b>'+(totals.commission?rm(totals.commission):'—')+'</b></td><td class="right"><b>'+(totals.roi?totals.roi+'x':'—')+'</b></td><td>—</td></tr>';
  document.getElementById('camp-tbody').innerHTML=rows+totalsRow;
}
</script>
</body>
</html>
