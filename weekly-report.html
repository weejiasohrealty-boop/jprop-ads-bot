<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Ads Report — ScaleWithPB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181b;
    --border: rgba(255,255,255,0.08);
    --paper: #e8e0d0;
    --muted: #888;
    --gold: #e0b755;
    --green: #4caf82;
    --red: #e05555;
    --blue: #5590e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--paper); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; min-height: 100vh; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .header-left .week-label { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--paper); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background .15s; }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn.active { background: var(--gold); color: #0e0e10; border-color: var(--gold); font-weight: 600; }

  .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  /* KPI row */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .kpi.hi  { border-color: rgba(224,183,85,0.3);  background: rgba(224,183,85,0.04); }
  .kpi.hi2 { border-color: rgba(76,175,130,0.3); background: rgba(76,175,130,0.04); }
  .kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
  .kpi-value { font-size: 22px; font-weight: 700; }
  .kpi-value.gold  { color: var(--gold); }
  .kpi-value.green { color: var(--green); }

  /* Charts grid */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 16px; }
  .chart-canvas { position: relative; height: 220px; }

  /* Table */
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 14px; }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); }
  th { background: rgba(255,255,255,0.03); padding: 10px 12px; text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.r { text-align: right; }
  td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  td.r { text-align: right; }
  tr:last-child td { border-bottom: none; }
  tr.region-header td { background: rgba(176,141,62,0.07); border-top: 2px solid var(--border); font-weight: 600; font-size: 12px; }
  tr.total-row td { background: rgba(255,255,255,0.03); font-weight: 600; border-top: 1px solid var(--border); }
  .camp-name { font-weight: 500; font-size: 12px; }
  .camp-acc  { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .gold-val  { color: var(--gold); }
  .green-val { color: var(--green); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; letter-spacing: .05em; }
  .badge-active  { background: rgba(76,175,130,0.15); color: var(--green); }
  .badge-paused  { background: rgba(136,136,136,0.15); color: var(--muted); }

  .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .custom-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding: 10px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .custom-row label { font-size:11px; color:var(--muted); }
  .custom-row input[type=date] { background:#111; border:1px solid var(--border); color:var(--paper); padding:5px 10px; border-radius:6px; font-size:12px; }
  .custom-row input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>📊 Weekly Ads Report</h1>
    <div class="week-label" id="week-label">Loading…</div>
  </div>
  <div class="header-right">
    <button class="btn active" id="btn-last"       onclick="loadReport('last_week_sun_sat',this)">Last Week</button>
    <button class="btn"        id="btn-this"       onclick="loadReport('this_week_sun_today',this)">This Week</button>
    <button class="btn"        id="btn-lastmonth"  onclick="loadReport('last_month',this)">Last Month</button>
    <button class="btn"        id="btn-month"      onclick="loadReport('this_month',this)">This Month</button>
    <button class="btn"        id="btn-custom"     onclick="toggleCustom()">Custom ▾</button>
    <button class="btn"        onclick="downloadCSV()">⬇ CSV</button>
  </div>
</div>

<div class="custom-row" id="custom-row" style="display:none;">
  <label>From</label>
  <input type="date" id="custom-since">
  <label>To</label>
  <input type="date" id="custom-until">
  <button class="btn" onclick="applyCustom()">Apply</button>
</div>

<div class="main" id="main-content">
  <div class="loading-state" id="loading-msg">Fetching your weekly data…</div>
</div>

<script>
var REGION_COLORS = {
  'Penang':        '#e07855',
  'JB CIQ':        '#55a8e0',
  'Petaling Jaya': '#e0b755',
  'Bukit Jalil':   '#4caf82',
  'KLCC':          '#9b59b6',
  'Bangsar':       '#e05590',
};
function regionColor(r) { return REGION_COLORS[r] || '#888'; }
function rm(v) { return 'RM ' + Number(v).toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var currentPreset = 'last_week_sun_sat';
var customSince = '', customUntil = '';
var allCampaigns = [];
var regionMap = {};

// Load saved region assignments
try { regionMap = JSON.parse(localStorage.getItem('jprop_regions') || '{}'); } catch(e) {}

function toggleCustom() {
  var row = document.getElementById('custom-row');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
  // Default dates
  var now = new Date();
  var y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  document.getElementById('custom-since').value = document.getElementById('custom-since').value || (y+'-'+m+'-01');
  document.getElementById('custom-until').value = document.getElementById('custom-until').value || (y+'-'+m+'-'+d);
}

function applyCustom() {
  var since = document.getElementById('custom-since').value;
  var until = document.getElementById('custom-until').value;
  if (!since || !until) return;
  customSince = since; customUntil = until;
  document.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('btn-custom').classList.add('active');
  loadReport('custom', null);
}

function loadReport(preset, btn) {
  currentPreset = preset;
  document.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.getElementById('main-content').innerHTML = '<div class="loading-state">Fetching data…</div>';

  var url = '/api/admin/campaigns?preset=' + preset;
  if (preset === 'custom' && customSince && customUntil) {
    url = '/api/admin/campaigns?preset=custom&since=' + customSince + '&until=' + customUntil;
  }

  Promise.all([
    fetch(url).then(function(r){ return r.json(); }),
    fetch('/api/admin/profits').then(function(r){ return r.json(); }).catch(function(){ return []; })
  ]).then(function(results) {
    var campaigns = results[0];
    var profits   = results[1];
    var profitMap = {};
    profits.forEach(function(p){ profitMap[p.campaign_id] = p; });

    // Enrich campaigns
    allCampaigns = campaigns.map(function(c) {
      c.region = regionMap[c.campaign_id] || '';
      var pr = profitMap[c.campaign_id] || {};
      c.closing_sales = pr.closing_sales || 0;
      c.commission    = pr.commission    || 0;
      c.roi = c.spend && c.commission ? Math.round(c.commission / c.spend * 100) / 100 : 0;
      return c;
    });

    setWeekLabel(preset);
    renderAll();
  }).catch(function(e) {
    document.getElementById('main-content').innerHTML = '<div class="loading-state" style="color:#e05555;">Failed to load: ' + esc(e.message) + '</div>';
  });
}

function setWeekLabel(preset) {
  var now = new Date();
  var lbl = '';
  if (preset === 'last_week_sun_sat') {
    var day = now.getDay();
    var lastSun = new Date(now); lastSun.setDate(now.getDate() - day - 7);
    var lastSat = new Date(lastSun); lastSat.setDate(lastSun.getDate() + 6);
    lbl = 'Week of ' + lastSun.toLocaleDateString('en-MY', {day:'numeric',month:'short'}) + ' – ' + lastSat.toLocaleDateString('en-MY', {day:'numeric',month:'short',year:'numeric'});
  } else if (preset === 'this_week_sun_today') {
    lbl = 'This week (Sun – today)';
  } else if (preset === 'last_month') {
    var lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    lbl = lm.toLocaleDateString('en-MY', {month:'long', year:'numeric'});
  } else if (preset === 'this_month') {
    lbl = now.toLocaleDateString('en-MY', {month:'long', year:'numeric'});
  } else if (preset === 'custom' && customSince && customUntil) {
    lbl = customSince + ' – ' + customUntil;
  }
  document.getElementById('week-label').textContent = lbl;
}

function renderAll() {
  var el = document.getElementById('main-content');
  el.innerHTML = '';

  // ─── KPIs ───
  var active = allCampaigns.filter(function(c){ return (c.effective_status||'ACTIVE')==='ACTIVE'; });
  var tot = aggregate(allCampaigns);
  var actBudget = active.reduce(function(s,c){ return s+(c.daily_budget||0); }, 0);

  var kpiRow = document.createElement('div');
  kpiRow.className = 'kpi-row';
  kpiRow.innerHTML =
    kpiCard('Active Budget/day', actBudget ? rm(actBudget) : '—', 'green', 'hi2') +
    kpiCard('Total Budget/day',  tot.budget ? rm(tot.budget) : '—', '', '') +
    kpiCard('Total Spend',       rm(tot.spend), 'gold', 'hi') +
    kpiCard('Total Leads',       tot.leads || '—', '', '') +
    kpiCard('Avg CPL',           tot.cpl ? rm(tot.cpl) : '—', '', '') +
    kpiCard('Closings',          tot.closing_sales || '—', 'gold', '') +
    kpiCard('Commission',        tot.commission ? rm(tot.commission) : '—', 'green', 'hi2') +
    kpiCard('ROI',               tot.roi ? tot.roi + 'x' : '—', tot.roi >= 2 ? 'green' : tot.roi >= 1 ? 'gold' : '', '');
  el.appendChild(kpiRow);

  // ─── Charts ───
  var REGIONS = Object.keys(REGION_COLORS);
  var rStats = {};
  REGIONS.forEach(function(r){ rStats[r] = {spend:0, leads:0, cpmVals:[], budget:0, closings:0, commission:0, count:0}; });
  allCampaigns.forEach(function(c) {
    var r = c.region;
    if (r && rStats[r]) {
      rStats[r].spend      += c.spend || 0;
      rStats[r].leads      += c.leads || 0;
      rStats[r].budget     += c.daily_budget || 0;
      rStats[r].closings   += c.closing_sales || 0;
      rStats[r].commission += c.commission || 0;
      rStats[r].count++;
      if (c.cpm) rStats[r].cpmVals.push(c.cpm);
    }
  });
  var activeRegions = REGIONS.filter(function(r){ return rStats[r].count > 0; });
  var rLabels  = activeRegions;
  var rColors  = activeRegions.map(function(r){ return regionColor(r); });
  var rSpend   = activeRegions.map(function(r){ return Math.round(rStats[r].spend*100)/100; });
  var rLeads   = activeRegions.map(function(r){ return rStats[r].leads; });
  var rBudget  = activeRegions.map(function(r){ return Math.round(rStats[r].budget); });
  var rCPM     = activeRegions.map(function(r){ var v=rStats[r].cpmVals; return v.length?Math.round(v.reduce(function(a,b){return a+b;},0)/v.length*100)/100:0; });
  var rCPL     = activeRegions.map(function(r){ var s=rStats[r]; return s.leads?Math.round(s.spend/s.leads*100)/100:0; });

  var chartsGrid = document.createElement('div');
  chartsGrid.className = 'charts-grid';
  chartsGrid.innerHTML =
    chartCard('spend-chart',  'Spend by Region (RM)') +
    chartCard('cpm-chart',    'Avg CPM by Region (RM)') +
    chartCard('leads-chart',  'Leads by Region') +
    chartCard('cpl-chart',    'Avg CPL by Region (RM)');
  el.appendChild(chartsGrid);

  // Render charts after DOM is ready
  setTimeout(function() {
    makeBarChart('spend-chart',  rLabels, rSpend,  rColors, 'RM');
    makeBarChart('cpm-chart',    rLabels, rCPM,    rColors, 'RM');
    makeBarChart('leads-chart',  rLabels, rLeads,  rColors, '');
    makeBarChart('cpl-chart',    rLabels, rCPL,    rColors, 'RM');
  }, 0);

  // ─── Region summary table ───
  var secTitle = document.createElement('div');
  secTitle.className = 'section-title';
  secTitle.textContent = 'Region Summary';
  el.appendChild(secTitle);

  var regionTableWrap = document.createElement('div');
  regionTableWrap.className = 'table-wrap';
  regionTableWrap.style.marginBottom = '28px';
  var rRows = activeRegions.map(function(r) {
    var s = rStats[r];
    var cpl = s.leads ? Math.round(s.spend/s.leads*100)/100 : 0;
    var avgCPM = s.cpmVals.length ? Math.round(s.cpmVals.reduce(function(a,b){return a+b;},0)/s.cpmVals.length*100)/100 : 0;
    var roi = s.spend && s.commission ? Math.round(s.commission/s.spend*100)/100 : 0;
    return '<tr>' +
      '<td><span class="dot" style="background:'+regionColor(r)+'"></span>'+esc(r)+'</td>' +
      '<td class="r">'+s.count+'</td>' +
      '<td class="r" style="color:var(--muted);">'+(s.budget?'RM '+Math.round(s.budget):'—')+'</td>' +
      '<td class="r gold-val">'+rm(s.spend)+'</td>' +
      '<td class="r">'+s.leads+'</td>' +
      '<td class="r">'+(cpl?rm(cpl):'—')+'</td>' +
      '<td class="r" style="color:var(--muted);">'+(avgCPM?rm(avgCPM):'—')+'</td>' +
      '<td class="r">'+s.closings+'</td>' +
      '<td class="r green-val">'+(s.commission?rm(s.commission):'—')+'</td>' +
      '<td class="r" style="color:'+(roi>=2?'var(--green)':roi>=1?'var(--gold)':'var(--red)')+';">'+(roi?roi+'x':'—')+'</td>' +
      '</tr>';
  }).join('');
  regionTableWrap.innerHTML = '<table>' +
    '<thead><tr>' +
    '<th>Region</th><th class="r">Campaigns</th><th class="r">Budget/day</th><th class="r">Spend</th>' +
    '<th class="r">Leads</th><th class="r">CPL</th><th class="r">Avg CPM</th>' +
    '<th class="r">Closings</th><th class="r">Commission</th><th class="r">ROI</th>' +
    '</tr></thead><tbody>' + rRows + '</tbody></table>';
  el.appendChild(regionTableWrap);

  // ─── Campaign breakdown ───
  var sec2 = document.createElement('div');
  sec2.className = 'section-title';
  sec2.textContent = 'Campaign Breakdown by Region';
  el.appendChild(sec2);

  var campWrap = document.createElement('div');
  campWrap.className = 'table-wrap';

  // Group by region
  var grouped = {};
  var noRegion = [];
  allCampaigns.filter(function(c){ return (c.spend||0)>0; }).forEach(function(c) {
    if (c.region) {
      if (!grouped[c.region]) grouped[c.region] = [];
      grouped[c.region].push(c);
    } else {
      noRegion.push(c);
    }
  });

  var campRows = '';
  var allGrouped = activeRegions.filter(function(r){ return grouped[r]; });
  allGrouped.forEach(function(r) {
    var grp = grouped[r];
    var gs = aggregate(grp);
    campRows += '<tr class="region-header"><td colspan="10" style="padding:8px 12px;">' +
      '<span class="dot" style="background:'+regionColor(r)+'"></span>' +
      esc(r) + ' <span style="color:var(--muted);font-size:11px;font-weight:400;">'+grp.length+' campaign'+(grp.length!==1?'s':'')+'</span>' +
      '<span style="float:right;color:var(--gold);font-size:11px;font-weight:400;">'+rm(gs.spend)+' spend &nbsp;·&nbsp; '+gs.leads+' leads &nbsp;·&nbsp; '+(gs.cpl?rm(gs.cpl)+' CPL':'—')+'</span>' +
      '</td></tr>';
    grp.forEach(function(c) {
      campRows += campRow(c);
    });
  });
  if (noRegion.length) {
    campRows += '<tr class="region-header"><td colspan="10" style="padding:8px 12px;color:var(--muted);">— No Region Assigned —</td></tr>';
    noRegion.forEach(function(c) { campRows += campRow(c); });
  }

  campWrap.innerHTML = '<table>' +
    '<thead><tr>' +
    '<th>Campaign</th><th>Account</th><th>Status</th>' +
    '<th class="r">Budget/day</th><th class="r">Spend</th><th class="r">Leads</th>' +
    '<th class="r">CPL</th><th class="r">CPM</th><th class="r">Closings</th><th class="r">ROI</th>' +
    '</tr></thead><tbody>' + campRows + '</tbody></table>';
  el.appendChild(campWrap);
}

function campRow(c) {
  var roi = c.roi || 0;
  var roiColor = roi>=2?'var(--green)':roi>=1?'var(--gold)':'var(--red)';
  var status = (c.effective_status||'ACTIVE').toUpperCase();
  return '<tr>' +
    '<td><div class="camp-name">'+esc(c.campaign_name)+'</div><div class="camp-acc">'+esc(c.account_label||'')+'</div></td>' +
    '<td style="font-size:11px;color:var(--muted);">'+esc(c.account_label||'')+'</td>' +
    '<td><span class="badge '+(status==='ACTIVE'?'badge-active':'badge-paused')+'">'+status+'</span></td>' +
    '<td class="r" style="color:var(--muted);">'+(c.daily_budget?'RM '+Math.round(c.daily_budget):'—')+'</td>' +
    '<td class="r gold-val">'+rm(c.spend)+'</td>' +
    '<td class="r">'+(c.leads||'—')+'</td>' +
    '<td class="r">'+(c.cpl?rm(c.cpl):'—')+'</td>' +
    '<td class="r" style="color:var(--muted);">'+(c.cpm?'RM '+c.cpm:'—')+'</td>' +
    '<td class="r">'+(c.closing_sales||'—')+'</td>' +
    '<td class="r" style="color:'+roiColor+';">'+(roi?roi+'x':'—')+'</td>' +
    '</tr>';
}

function aggregate(arr) {
  var t = arr.reduce(function(acc, c) {
    return {
      budget:        acc.budget        + (c.daily_budget||0),
      spend:         acc.spend         + (c.spend||0),
      leads:         acc.leads         + (c.leads||0),
      closing_sales: acc.closing_sales + (c.closing_sales||0),
      commission:    acc.commission    + (c.commission||0)
    };
  }, {budget:0, spend:0, leads:0, closing_sales:0, commission:0});
  t.cpl = t.leads ? Math.round(t.spend/t.leads*100)/100 : 0;
  t.roi = t.spend && t.commission ? Math.round(t.commission/t.spend*100)/100 : 0;
  return t;
}

function kpiCard(label, value, colorClass, hiClass) {
  return '<div class="kpi '+(hiClass||'')+'"><div class="kpi-label">'+label+'</div><div class="kpi-value '+(colorClass||'')+'">'+value+'</div></div>';
}

function chartCard(id, title) {
  return '<div class="chart-card"><div class="chart-title">'+title+'</div><div class="chart-canvas"><canvas id="'+id+'"></canvas></div></div>';
}

function makeBarChart(id, labels, data, colors, prefix) {
  var ctx = document.getElementById(id);
  if (!ctx) return;
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors.map(function(c){ return c+'33'; }),
        borderColor: colors,
        borderWidth: 1.5,
        borderRadius: 5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) { return prefix ? prefix + ' ' + ctx.parsed.y.toLocaleString() : ctx.parsed.y.toLocaleString(); }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#888', font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        y: {
          ticks: {
            color: '#888', font: { size: 10 },
            callback: function(v) { return prefix ? prefix+' '+v.toLocaleString() : v.toLocaleString(); }
          },
          grid: { color: 'rgba(255,255,255,0.04)' }
        }
      }
    }
  });
}

// CSV export
function downloadCSV() {
  if (!allCampaigns.length) return;
  var header = ['Campaign','Account','Region','Status','Budget/day','Spend','Leads','CPL','CPM','Hook%','CTR','Closings','Commission','ROI'];
  var rows = allCampaigns.filter(function(c){ return (c.spend||0)>0; }).map(function(c) {
    return [
      '"'+(c.campaign_name||'').replace(/"/g,'""')+'"',
      '"'+(c.account_label||'').replace(/"/g,'""')+'"',
      '"'+(c.region||'').replace(/"/g,'""')+'"',
      c.effective_status||'ACTIVE',
      c.daily_budget||0,
      c.spend||0,
      c.leads||0,
      c.cpl||0,
      c.cpm||0,
      c.hook_pct||0,
      c.ctr||0,
      c.closing_sales||0,
      c.commission||0,
      c.roi||0
    ].join(',');
  });
  var csv = [header.join(',')].concat(rows).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weekly-report-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// Auto-load on page open
loadReport('last_week_sun_sat', document.getElementById('btn-last'));
</script>
</body>
